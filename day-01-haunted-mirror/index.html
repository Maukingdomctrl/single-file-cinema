<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haunted Mirror</title>
<style>
:root{--cream:#f4dfd0;--ember:#ff8a43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
button{font:inherit}

.room{position:relative;width:100vw;height:100vh;height:100svh;min-height:520px;overflow:hidden;isolation:isolate;
 background:radial-gradient(ellipse at 50% 42%,rgba(69,28,67,.3),transparent 40%),radial-gradient(ellipse at 50% 85%,rgba(94,16,28,.14),transparent 50%),linear-gradient(180deg,#08050b,#110711 55%,#030205)}
.room:before{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;
 background:radial-gradient(ellipse at 50% 46%,transparent 35%,rgba(0,0,0,.72) 100%),linear-gradient(90deg,rgba(0,0,0,.5),transparent 30%,transparent 70%,rgba(0,0,0,.55))}
.ceiling{position:absolute;inset:0 0 auto;height:24%;background:linear-gradient(180deg,#020204,transparent);opacity:.7}
.wallGlow{position:absolute;left:50%;top:40%;width:90vw;height:64vh;transform:translate(-50%,-50%);
 background:radial-gradient(ellipse,rgba(92,25,67,.2),transparent 65%);filter:blur(24px);transition:background 1.4s;animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.75}to{opacity:1}}
.scene.uneasy .wallGlow{background:radial-gradient(ellipse,rgba(143,21,37,.3),transparent 66%)}

/* typography */
.title{position:absolute;z-index:40;top:6.5%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;
 font-size:clamp(14px,2.1vw,23px);letter-spacing:.38em;font-weight:400;color:#e9d9d8;text-shadow:0 0 20px rgba(230,145,145,.15);transition:opacity .6s}
.subtitle{display:block;margin-top:10px;font:9px Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#85748a;transition:color 1s}
.scene.uneasy .subtitle{color:#b0525f}

/* mirror */
.mirror{position:absolute;z-index:20;left:50%;top:51%;width:min(70vw,760px);height:min(73vh,1120px);transform:translate(-50%,-50%);
 filter:drop-shadow(0 28px 40px rgba(0,0,0,.8));transition:transform .8s cubic-bezier(.2,.8,.2,1),filter 1s}
.frame{position:absolute;inset:0;border-radius:46% 46% 5% 5% / 27% 27% 5% 5%;
 background:linear-gradient(135deg,#21131a,#09060a 25%,#3a2023 49%,#0b070b 68%,#27151c);
 box-shadow:inset 0 0 0 5px #120b10,inset 0 0 0 11px rgba(103,61,56,.45),inset 0 0 45px rgba(0,0,0,.8),0 0 0 2px rgba(145,91,71,.25)}
.frame:before,.frame:after{content:"";position:absolute;border:2px solid rgba(144,92,76,.5);border-radius:48% 48% 4% 4% / 28% 28% 4% 4%;inset:14px;pointer-events:none}
.frame:after{inset:27px;border-color:rgba(42,22,29,.9);border-width:4px}
.orn{position:absolute;z-index:2;color:#8d5a49;opacity:.72;font-size:58px;line-height:1}
.orn.tl{top:8px;left:20px;transform:rotate(-20deg)}
.orn.tr{top:8px;right:20px;transform:scaleX(-1) rotate(-20deg)}
.orn.bl{bottom:8px;left:18px;transform:scaleY(-1) rotate(-20deg)}
.orn.br{bottom:8px;right:18px;transform:scale(-1) rotate(-20deg)}

.glass{position:absolute;z-index:3;inset:34px;border-radius:43% 43% 2% 2% / 25% 25% 2% 2%;overflow:hidden;
 background:radial-gradient(ellipse at 48% 32%,rgba(52,30,53,.6),transparent 42%),linear-gradient(180deg,#08070d,#100914 58%,#06050a);
 box-shadow:inset 0 0 70px rgba(0,0,0,.92),inset 0 0 5px rgba(207,151,126,.38);transition:box-shadow 1.2s}
.glass:before{content:"";position:absolute;inset:-20%;z-index:9;pointer-events:none;
 background:repeating-radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.02) 0 1px,transparent 1px 4px);mix-blend-mode:screen;opacity:.42;animation:grain .4s steps(2) infinite}
.glass:after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;
 background:linear-gradient(112deg,rgba(255,255,255,.08),transparent 19%,transparent 70%,rgba(151,90,120,.07))}
@keyframes grain{50%{transform:translate(1%,-1%)}}
.mist{position:absolute;inset:-10%;z-index:5;pointer-events:none;filter:blur(22px);opacity:.55;
 background:radial-gradient(ellipse at 20% 70%,rgba(190,170,200,.10),transparent 38%),radial-gradient(ellipse at 75% 55%,rgba(190,170,200,.08),transparent 36%);
 animation:mist 14s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-6%) translateY(2%)}to{transform:translateX(7%) translateY(-3%)}}

/* reflection (mirrored room) */
.reflection{position:absolute;inset:0;transform:scaleX(-1);transition:transform 2.4s ease,filter 1.2s;animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{margin-left:-.4%}to{margin-left:.4%}}
.ref-room{position:absolute;inset:0;background:radial-gradient(circle at 50% 23%,rgba(255,150,86,.13),transparent 15%),linear-gradient(180deg,transparent 0 55%,rgba(0,0,0,.55) 100%)}
.ref-window{position:absolute;left:12%;top:20%;width:18%;height:26%;border:2px solid rgba(120,80,90,.22);background:linear-gradient(180deg,rgba(60,40,90,.16),rgba(20,12,30,.1));transition:transform 1.6s ease}
.ref-table{position:absolute;left:-8%;right:-8%;bottom:14%;height:8%;background:linear-gradient(180deg,#161019,#050408);transform:perspective(500px) rotateX(56deg);box-shadow:0 -12px 30px rgba(0,0,0,.6)}
.ref-candle{position:absolute;width:15px;height:60px;bottom:22%;background:linear-gradient(90deg,#5e4440,#d3a06f 48%,#4e3735);box-shadow:0 0 20px rgba(255,130,52,.18);transition:transform 1.8s ease,opacity 1s}
.ref-candle:after{content:"";position:absolute;width:9px;height:18px;left:3px;top:-17px;border-radius:60% 40% 60% 40%;background:#ffb35c;filter:blur(1px);box-shadow:0 0 14px 5px rgba(255,100,30,.35);animation:flame .12s infinite alternate}
.ref-candle.a{left:20%}
.ref-candle.b{right:21%;height:42px;bottom:25%}
.ref-candle.b:after{animation-duration:.18s}
@keyframes flame{from{transform:scale(.9,.85) rotate(-3deg);opacity:.75}to{transform:scale(1.12,1.08) rotate(4deg);opacity:1}}

/* reflection behaves wrongly: moves against the real room */
.scene.uneasy .reflection{transform:scaleX(-1) translateX(2%) skewX(-1deg);filter:brightness(1.1) hue-rotate(-12deg)}
.scene.uneasy .ref-window{transform:translateX(-18%)}
.scene.uneasy .ref-candle.a{transform:translateY(-10px)}
.scene.uneasy .ref-candle.b{opacity:.15}

/* ghost */
.ghost{position:absolute;z-index:6;left:50%;top:37%;width:42%;aspect-ratio:.68;transform:translate(-50%,-50%) scale(.78);opacity:0;filter:blur(8px);
 transition:opacity 1.8s ease,filter 1.8s ease,transform 2.2s ease}
.ghost:before{content:"";position:absolute;inset:0 4% 10%;border-radius:48% 48% 35% 35%;
 background:radial-gradient(ellipse at 50% 27%,rgba(241,232,228,.42) 0 12%,rgba(213,198,201,.25) 28%,rgba(117,95,106,.13) 54%,transparent 76%);
 box-shadow:0 0 35px rgba(228,204,209,.28),0 0 80px rgba(174,128,143,.16)}
.ghost:after{content:"";position:absolute;left:15%;right:15%;bottom:0;height:45%;border-radius:50% 50% 8% 8%;
 background:radial-gradient(ellipse at 50% 20%,rgba(207,193,198,.2),rgba(78,60,71,.1) 58%,transparent 74%);filter:blur(2px)}
.eye{position:absolute;top:37%;width:15%;height:8%;border-radius:50%;background:rgba(255,74,78,.9);box-shadow:0 0 10px rgba(255,60,65,.9),0 0 26px rgba(218,31,43,.7);filter:blur(.6px);z-index:2}
.eye.l{left:25%}.eye.r{right:25%}
.mouth{position:absolute;top:57%;left:31%;width:38%;height:13%;border-bottom:3px solid rgba(224,210,214,.35);border-radius:0 0 50% 50%;filter:blur(1px);z-index:2}
.scene.ghostOn .ghost{opacity:.8;filter:blur(2px);transform:translate(-50%,-50%) scale(.98)}
.scene.ghostOn .glass{box-shadow:inset 0 0 70px rgba(0,0,0,.92),inset 0 0 28px rgba(156,20,42,.4)}
.scene.uneasy:not(.ghostOn) .glass{box-shadow:inset 0 0 70px rgba(0,0,0,.92),inset 0 0 14px rgba(156,20,42,.22)}

/* light flicker overlay */
.lights{position:absolute;inset:0;z-index:31;background:#000;opacity:0;pointer-events:none}
.scene.uneasy .lights{animation:lightflick 2.8s steps(1) 1}
@keyframes lightflick{0%{opacity:0}6%{opacity:.55}9%{opacity:0}18%{opacity:.35}20%{opacity:0}42%{opacity:.7}45%{opacity:.1}48%{opacity:.6}52%{opacity:0}100%{opacity:0}}

/* room candles */
.rc{position:absolute;z-index:26;bottom:5%;width:16px;height:70px;background:linear-gradient(90deg,#4a3532,#d8a874 48%,#3e2c2a);box-shadow:0 0 30px rgba(255,130,52,.15)}
.rc:before{content:"";position:absolute;left:50%;top:-64px;width:210px;height:210px;margin-left:-105px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,130,52,.28),transparent 62%);animation:glowflick .23s infinite alternate;pointer-events:none}
.rc:after{content:"";position:absolute;width:10px;height:22px;left:3px;top:-21px;border-radius:60% 40% 60% 40%;background:#ffc47a;filter:blur(1px);
 box-shadow:0 0 16px 6px rgba(255,100,30,.45);animation:flame .13s infinite alternate}
.rc.l{left:7%}.rc.r{right:8%;height:52px}
.rc.r:after{animation-duration:.19s}
@keyframes glowflick{from{opacity:.65;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}

/* fog, dust, particles */
.fog{position:absolute;z-index:25;left:-20%;width:140%;height:30%;bottom:4%;pointer-events:none;filter:blur(18px);
 background:radial-gradient(ellipse at 15% 50%,rgba(185,168,190,.1),transparent 27%),radial-gradient(ellipse at 50% 45%,rgba(218,200,211,.12),transparent 30%),radial-gradient(ellipse at 83% 55%,rgba(175,155,181,.09),transparent 26%);
 animation:fog 18s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-4%)}to{transform:translateX(5%)}}
.dust{position:absolute;z-index:27;inset:0;pointer-events:none}
.dust i{position:absolute;width:2px;height:2px;border-radius:50%;background:#e4c9bb;box-shadow:0 0 7px rgba(255,185,139,.4);opacity:0;animation:float var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes float{from{transform:translate3d(0,25px,0);opacity:0}20%{opacity:.45}to{transform:translate3d(var(--x),-220px,0);opacity:0}}
.burst{position:absolute;z-index:28;left:50%;top:44%;width:0;height:0;pointer-events:none}
.burst b{position:absolute;left:0;top:0;border-radius:50%;background:#f2d6cc;box-shadow:0 0 10px rgba(255,120,110,.8);opacity:0}

/* UI */
.status{position:absolute;z-index:45;left:50%;top:14%;transform:translateX(-50%);font:10px Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#a47c8c;opacity:0;transition:opacity .8s;white-space:nowrap;pointer-events:none}
.scene.ghostOn .status{opacity:1}
.cta{position:absolute;z-index:45;left:50%;bottom:7.5%;transform:translateX(-50%) translateY(10px);border:1px solid rgba(207,150,126,.45);background:rgba(8,5,10,.72);color:#eadbd5;
 padding:15px 30px;min-width:205px;letter-spacing:.27em;text-transform:uppercase;font:600 10px Arial,sans-serif;cursor:pointer;
 box-shadow:0 12px 35px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .9s,transform .9s,background .3s,box-shadow .3s}
.scene.ready .cta{opacity:1;pointer-events:auto;transform:translateX(-50%);animation:ctapulse 2.4s ease-in-out infinite 1s}
.scene.ready .cta:hover{background:rgba(114,25,39,.3);box-shadow:0 0 32px rgba(171,39,51,.25);transform:translateX(-50%) translateY(-3px);animation:none}
@keyframes ctapulse{50%{box-shadow:0 12px 35px rgba(0,0,0,.5),0 0 26px rgba(171,39,51,.28)}}

/* cracks */
.cracks{position:absolute;z-index:8;inset:34px;border-radius:43% 43% 2% 2% / 25% 25% 2% 2%;overflow:hidden;opacity:0;pointer-events:none}
.crack{position:absolute;height:1px;background:linear-gradient(90deg,#fff,#dbc9c7 40%,transparent);transform-origin:left center;box-shadow:0 0 5px rgba(255,230,225,.4);transform:scaleX(0)}
.c1{width:46%;left:50%;top:42%;--r:15deg}.c2{width:38%;left:50%;top:42%;--r:58deg}.c3{width:32%;left:50%;top:42%;--r:-48deg}
.c4{width:30%;left:50%;top:42%;--r:170deg}.c5{width:34%;left:50%;top:42%;--r:128deg}.c6{width:26%;left:50%;top:42%;--r:-120deg}
.c7{width:20%;left:66%;top:48%;--r:70deg}.c8{width:18%;left:30%;top:46%;--r:-30deg}
.scene.reveal .cracks{opacity:.75}
.scene.reveal .crack{animation:spread .55s cubic-bezier(.2,.9,.3,1) forwards}
.c2{animation-delay:.06s!important}.c3{animation-delay:.1s!important}.c4{animation-delay:.14s!important}.c5{animation-delay:.18s!important}.c6{animation-delay:.22s!important}.c7{animation-delay:.3s!important}.c8{animation-delay:.34s!important}
@keyframes spread{from{transform:rotate(var(--r)) scaleX(0)}to{transform:rotate(var(--r)) scaleX(1)}}

/* reveal */
.blackout,.flash{position:absolute;inset:0;z-index:60;pointer-events:none;opacity:0}
.blackout{background:#000;z-index:61}
.flash{background:#f5dfd3}
.scene.black .blackout{opacity:1;transition:opacity .12s}
.scene.reveal .flash{animation:flash .8s ease-out}
@keyframes flash{0%{opacity:.9}18%{opacity:.1}30%{opacity:.4}100%{opacity:0}}
.scene.reveal .mirror{animation:shake .6s ease-out;filter:drop-shadow(0 0 70px rgba(162,20,34,.5))}
@keyframes shake{0%{transform:translate(-50%,-50%) scale(1.07)}20%{transform:translate(-49.2%,-50.4%) scale(1.05)}40%{transform:translate(-50.7%,-49.7%) scale(1.045)}100%{transform:translate(-50%,-50%) scale(1.03)}}
.scene.reveal .mirror{transform:translate(-50%,-50%) scale(1.03)}
.scene.reveal .wallGlow{background:radial-gradient(ellipse,rgba(190,20,36,.6),transparent 66%)}
.scene.reveal .ghost{opacity:1;filter:blur(.3px);transform:translate(-50%,-47%) scale(1.55);transition:opacity .25s,filter .6s,transform 1.4s cubic-bezier(.1,.8,.2,1)}
.scene.reveal .glass{box-shadow:inset 0 0 80px rgba(0,0,0,.95),inset 0 0 55px rgba(200,22,40,.65)}
.scene.reveal .fog{animation:fogBurst 1.6s ease-out forwards}
@keyframes fogBurst{from{transform:translateX(-3%) scale(1);opacity:1}45%{transform:translateX(2%) scale(1.9,2.6);opacity:1}to{transform:translateX(4%) scale(1.3,1.8);opacity:.8}}
.redfill{position:absolute;inset:0;z-index:29;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(190,16,32,.55),rgba(90,6,16,.55) 60%,rgba(30,2,8,.7));transition:opacity 1.2s}
.scene.reveal .redfill{opacity:1;animation:redpulse 2.2s ease-in-out infinite alternate}
@keyframes redpulse{from{opacity:.75}to{opacity:1}}

.final{position:absolute;z-index:50;inset:0;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .9s;padding:0 16px}
.final h2{font-size:clamp(44px,10vw,110px);font-weight:400;letter-spacing:.04em;margin:0;text-shadow:0 0 40px rgba(221,31,48,.6),0 4px 30px #000}
.final p{margin:18px 0 0;font:11px Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#e0b0b8;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s}
.reset{margin-top:34px;border:0;background:none;color:#a58a93;font:9px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity 1s;padding:12px}
.reset:hover{color:#e8cdd3}
.scene.finalState .final{opacity:1}
.scene.hello .final p{opacity:1;transform:none}
.scene.hello .reset{opacity:1;pointer-events:auto}
.scene.finalState .title,.scene.finalState .status,.scene.finalState .cta{opacity:0!important;pointer-events:none}
.scene.finalState .ghost{opacity:.45;filter:blur(3px)}

@media(max-width:600px){
 .title{top:5.2%;font-size:13px;letter-spacing:.3em}
 .subtitle{font-size:8px;letter-spacing:.2em}
 .mirror{width:90vw;height:66vh}
 .glass,.cracks{inset:28px}
 .cta{bottom:6%;padding:14px 23px}
 .status{top:12.5%;font-size:8px}
 .orn{font-size:42px}
 .final p{letter-spacing:.28em}
 .rc.l{left:3%}.rc.r{right:4%}
}
@media(prefers-reduced-motion:reduce){
 .glass:before,.mist,.fog,.reflection,.rc:before{animation:none!important}
}
</style>
</head>
<body>
<main class="room scene" id="room">
  <div class="ceiling"></div>
  <div class="wallGlow"></div>
  <div class="title">LOOK INTO THE MIRROR<span class="subtitle">Something is watching from the other side</span></div>

  <div class="mirror" id="mirror">
    <div class="frame">
      <span class="orn tl">❧</span><span class="orn tr">❧</span><span class="orn bl">❧</span><span class="orn br">❧</span>
    </div>
    <div class="glass">
      <div class="reflection">
        <div class="ref-room"></div>
        <div class="ref-window"></div>
        <div class="ref-table"></div>
        <div class="ref-candle a"></div>
        <div class="ref-candle b"></div>
        <div class="ghost"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div>
      </div>
      <div class="mist"></div>
    </div>
    <div class="cracks"><i class="crack c1"></i><i class="crack c2"></i><i class="crack c3"></i><i class="crack c4"></i><i class="crack c5"></i><i class="crack c6"></i><i class="crack c7"></i><i class="crack c8"></i></div>
  </div>

  <div class="rc l"></div><div class="rc r"></div>
  <div class="fog"></div>
  <div class="dust" id="dust"></div>
  <div class="burst" id="burst"></div>
  <div class="redfill"></div>
  <div class="lights"></div>

  <div class="status">Something is looking back</div>
  <button class="cta" id="cta" type="button">Look closer</button>

  <div class="final"><div>
    <h2>IT SAW YOU.</h2>
    <p>Happy Halloween.</p>
    <button class="reset" id="reset" type="button">Return to the mirror</button>
  </div></div>

  <div class="flash"></div>
  <div class="blackout"></div>
</main>

<script>
(() => {
  const room = document.getElementById('room');
  const cta = document.getElementById('cta');
  const reset = document.getElementById('reset');
  const dust = document.getElementById('dust');
  const burst = document.getElementById('burst');
  const mirror = document.getElementById('mirror');

  // dust motes
  for (let i = 0; i < 45; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.top = (20 + Math.random() * 75) + '%';
    p.style.setProperty('--x', ((Math.random() - .5) * 110) + 'px');
    p.style.setProperty('--d', (7 + Math.random() * 10) + 's');
    p.style.setProperty('--delay', (-Math.random() * 14) + 's');
    dust.appendChild(p);
  }

  let timers = [];
  let revealed = false;
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const clearAll = () => { timers.forEach(clearTimeout); timers = []; };

  // intro: normal -> reflection goes wrong -> ghost appears -> ghost fades -> button
  function intro() {
    at(2000, () => room.classList.add('uneasy'));   // reflection drifts, lights flicker, red glow
    at(2700, () => room.classList.add('ghostOn'));  // ghost slowly materialises
    at(5000, () => room.classList.remove('ghostOn')); // ghost vanishes
    at(5500, () => room.classList.add('ready'));    // "LOOK CLOSER"
  }

  function particleBurst() {
    burst.innerHTML = '';
    const n = 80;
    for (let i = 0; i < n; i++) {
      const b = document.createElement('b');
      const s = 1.5 + Math.random() * 4;
      b.style.width = b.style.height = s + 'px';
      burst.appendChild(b);
      const a = Math.random() * Math.PI * 2;
      const d = 120 + Math.random() * Math.max(innerWidth, innerHeight) * .6;
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d;
      if (b.animate) {
        b.animate(
          [{ transform: 'translate(0,0) scale(1)', opacity: 1 },
           { transform: `translate(${dx}px,${dy}px) scale(.3)`, opacity: 0 }],
          { duration: 1100 + Math.random() * 1100, easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards', delay: Math.random() * 120 }
        );
      }
    }
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    clearAll();
    room.classList.remove('ghostOn');
    room.classList.add('black');                       // 1. screen goes black
    at(280, () => {
      room.classList.remove('black');
      room.classList.add('reveal');                    // 2. flash, ghost close, cracks, fog, red light
      particleBurst();                                 // 3. particles burst outward
    });
    at(2100, () => room.classList.add('finalState'));  // "IT SAW YOU."
    at(3900, () => room.classList.add('hello'));       // "Happy Halloween." after a pause
  }

  function resetScene() {
    clearAll();
    revealed = false;
    room.classList.remove('black', 'reveal', 'finalState', 'hello', 'ghostOn', 'uneasy', 'ready');
    burst.innerHTML = '';
    intro();
  }

  cta.addEventListener('click', reveal);
  reset.addEventListener('click', resetScene);

  // subtle pointer parallax (mouse + touch)
  let raf = 0;
  addEventListener('pointermove', e => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      mirror.style.marginLeft = (x * 8) + 'px';
      mirror.style.marginTop = (y * 5) + 'px';
    });
  }, { passive: true });

  intro();

  // ?demo auto-clicks the button for screen recording
  if (new URLSearchParams(location.search).has('demo')) {
    setTimeout(() => cta.click(), 7000);
  }
})();
</script>
</body>
</html>
